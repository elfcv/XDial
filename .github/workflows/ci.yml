name: CI

on:
  push:
    branches: [main, xdial-beta]
  pull_request:

jobs:
  # Beta shares the formal identity, configuration library, App Group and
  # helper with stable. Persistent formats, cross-process protocols and
  # dependency versions therefore evolve only through main; xdial-beta may not
  # change the files below relative to where it last merged main.
  beta-shared-formats:
    name: xdial-beta keeps main's shared formats
    if: github.ref == 'refs/heads/xdial-beta' || github.base_ref == 'xdial-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: dependencies and configuration library format match main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          shared=(
            # Dependency versions and their local patches.
            go.mod go.sum third_party scripts/prepare-patched-go-mod.sh
            # Configuration library (profiles.enc) model, schema, storage and migration.
            macos/Sources/XDial/Models.swift
            macos/Sources/XDial/ProfileLibrary.swift
            macos/Sources/XDial/ProfileLibraryStore.swift
            macos/Sources/XDial/ProfileLibraryMigration.swift
            macos/Sources/XDial/GlobalConfiguration.swift
            macos/Sources/XDial/ConfigurationStorage.swift
            macos/Shared/JSONValue.swift
            # The core's Profile model and the portable Profile document.
            core/config/model.go
            core/config/profile_document.go
          )
          if ! git diff --quiet origin/main...HEAD -- "${shared[@]}"; then
            echo "::error::xdial-beta changes files whose formats evolve only through main"
            git diff --stat origin/main...HEAD -- "${shared[@]}"
            exit 1
          fi

  go:
    name: Go (lint + vet + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: public content gate
        run: make public-content-gate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: jev feedback loop tests (offline)
        run: make test-jev-loop
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt gate
        run: |
          unformatted=$(gofmt -l core/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt:" && echo "$unformatted" && exit 1
          fi
      - name: prepare patched Go dependencies
        run: make prepare-patched-go
      - name: go vet
        run: make go-vet
      - name: go build
        run: make go-build
      - name: install sing-box test validator
        run: |
          make sing-box-test-validator
          echo "$PWD/build/tools" >> "$GITHUB_PATH"
      - name: go test
        run: make test

  macos:
    name: macOS (swift compile + tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install macOS build tools
        run: |
          brew install ripgrep xcodegen
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: compile Debug and Release without distribution signing
        run: make ci-macos-build
      - name: connection transaction tests
        run: make test-macos-transaction MACOS_TEST_XCODEBUILD_FLAGS=CODE_SIGNING_ALLOWED=NO
      # The Debug run above only reaches the Debug identity's branches; the
      # formal identity (stable and beta releases) is asserted here.
      - name: formal identity tests (Release configuration, unsigned)
        run: |
          xcodebuild -project macos/XDial.xcodeproj -scheme XDialTests \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/macos-tests-release \
            CODE_SIGNING_ALLOWED=NO test
